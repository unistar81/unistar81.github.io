<!DOCTYPE html><html lang="en"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Popover: Explicit close and light dismiss</title><link rel="stylesheet" href="/concord/_astro/_id_.Bce4rZEa.css">
<style>html,body{margin:0}html{block-size:100%}body{box-sizing:border-box;background:var(--dsl-semantic-color-surface-page);place-items:center;min-block-size:20rem;padding:clamp(1rem,6vw,2.5rem);display:grid}.demo-root{max-inline-size:100%}body.demo-tooltip{min-block-size:100vh;padding:2rem;overflow:hidden}
